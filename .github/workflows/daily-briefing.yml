name: 每日全球动态简报
permissions:
  contents: write
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "指定日期 (留空=今天), 格式 YYYY-MM-DD"
        required: false
        default: ""
      no_email:
        description: "不发送邮件 (仅生成文件)"
        type: boolean
        required: false
        default: false

jobs:
  generate-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate briefing
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EXTRA_RECIPIENTS: ${{ secrets.EXTRA_RECIPIENTS }}
          RESEND_API_KEY_EXTRA: ${{ secrets.RESEND_API_KEY_EXTRA }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          WEATHER_LOCATION_ID: ${{ secrets.WEATHER_LOCATION_ID }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          WECOM_BOT_WEBHOOK: ${{ secrets.WECOM_BOT_WEBHOOK }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          if [ "${{ github.event.inputs.no_email }}" = "true" ]; then
            ARGS="$ARGS --no-email"
          fi
          python daily_briefing.py $ARGS 2>&1

      - name: Upload briefing as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briefing-${{ github.run_id }}
          path: output/每日简报-*.html
          retention-days: 30

      - name: Commit briefing to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          cp output/*.html docs/
          git add -f docs/
          git add -f output/
          git diff --staged --quiet || git commit -m "chore: daily briefing $(date +%Y-%m-%d)"
          git push
